<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AtomBlazor Demo (Hybrid)</title>
    <base href="/" />
    <!-- 与 Server/Wasm 宿主一致的 RCL 静态资源路径：实证 Hybrid 下 _content/ 清单可解析 -->
    <link rel="stylesheet" href="_content/AtomBlazor.Demo.Shared/css/app.css" />
    <link rel="stylesheet" href="_content/AtomBlazor/atomblazor.css" />
    <link rel="stylesheet" href="_content/AtomBlazor.Primitives/css/primitives.css" />
    <link rel="stylesheet" href="_content/AtomBlazor/css/themes.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" type="image/png" href="_content/AtomBlazor.Demo.Shared/favicon.png" />
    <!-- HeadOutlet 经 MainPage 的 RootComponent(Selector="head::after") 在运行时注入，此处不放标签 -->
    <!-- 主题初始化：首次绘制前套用已存主题，与宿主端形态一致 -->
    <script src="_content/AtomBlazor/js/theme-init.js"></script>
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
